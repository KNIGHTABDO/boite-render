<script type="module">

import * as THREE from 'three';
import * as K from '/engine/core.js';
import { stage, cast } from '/engine/stage3d.js';
import * as PR from '/engine/props3d.js';

P.bee.position.y = .25; P.cabochon.position.y = .02;
const fl = new THREE.Mesh(new THREE.PlaneGeometry(3, 2, 30, 20), new THREE.MeshBasicMaterial({ color: 0x9a8a70, wireframe: true, transparent: true, opacity: .25 }));
